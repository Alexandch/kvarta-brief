name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, build, and mobile Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kvarta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kvarta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kvarta_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
      - name: Run Lighthouse with mobile emulation
        run: npm run lighthouse
      - name: Keep Lighthouse HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-mobile-${{ github.sha }}
          path: artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Publish production site to Netlify
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Explain skipped deployment until Netlify is connected
        if: env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == ''
        run: echo "Verification passed. Configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets to enable automatic production deploys."
      - uses: actions/checkout@v5
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
      - uses: actions/setup-node@v5
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        with:
          node-version: 22
      - name: Build and deploy to Netlify production
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli deploy --build --prod --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"
