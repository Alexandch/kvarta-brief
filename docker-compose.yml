services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kvarta
      POSTGRES_USER: kvarta
      POSTGRES_PASSWORD: kvarta-local-password
    ports:
      - "5432:5432"
    volumes:
      - kvarta-postgres:/var/lib/postgresql/data
      - ./db/init/001_create_leads.sql:/docker-entrypoint-initdb.d/001_create_leads.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvarta -d kvarta"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kvarta:kvarta-local-password@db:5432/kvarta
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  kvarta-postgres:
